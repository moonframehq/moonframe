name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/site/**
      - netlify.toml
      - .github/workflows/site.yml

permissions: {}

# Serialize production uploads so an older deploy cannot finish after a newer one.
concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'moonframehq/moonframe'
    runs-on: ubuntu-24.04
    environment: website
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Netlify CLI
        run: npm install --global netlify-cli@27.16.3 # zizmor: ignore[adhoc-packages] -- Version-pinned deployment tool; the static site has no npm project.
      - name: Deploy production site without a Netlify build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # Netlify's API sometimes fails a deploy that works moments later
        # ("Project not found" with valid secrets), so try up to three times.
        run: |
          for attempt in 1 2 3; do
            netlify deploy --prod --dir=website/site --no-build && exit 0
            echo "::warning::deploy attempt $attempt failed"
            sleep $((attempt * 20))
          done
          exit 1
