name: Debug Windows ARM (temporary)

# TEMPORARY: which Luau build flags stop the heap corruption on Windows ARM64.

on:
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  trace:
    name: Luau with '${{ matrix.flags }}'
    runs-on: windows-11-arm
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flags: ['/EHc-', '/DLUA_USE_LONGJMP=1']
    env:
      LUAU_CXXFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Test the core
        run: cargo test --locked -p moonframe-core -- --test-threads=1
