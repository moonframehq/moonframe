name: Supply chain

on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml', '**/Cargo.lock', deny.toml, .github/workflows/supply-chain.yml]
  pull_request:
    paths: ['**/Cargo.toml', '**/Cargo.lock', deny.toml, .github/workflows/supply-chain.yml]
  # Advisories are filed against dependencies that are not changing, so this
  # has to run on a clock to be useful at all.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.check }})
    # cargo-deny reads the lockfile and never builds; deny.toml names every
    # shipped target, so one Linux runner covers them all.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Split so an advisory filed upstream does not mask a license or
        # source regression introduced by the change under review.
        check: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.check }}

  # The Wasm providers have lockfiles of their own, outside the workspace.
  providers-audit:
    name: Provider advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Check each provider's lockfile against the advisory database
        run: |
          for manifest in app/providers/*/Cargo.toml examples/*/providers/*/Cargo.toml; do
            [ -e "$manifest" ] || continue
            echo "provider: $(dirname "$manifest")"
            cargo deny --manifest-path "$manifest" check advisories
          done
