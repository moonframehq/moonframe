name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; every job below declares the scopes it needs.
permissions: {}

# A newer push cancels a pull request's run, but every commit on main gets
# a run of its own that finishes: a release requires a complete CI run for
# its exact commit, and in one shared group a newer push would replace a
# run still queued.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Smaller caches and faster builds; panics still report file and line.
  CARGO_PROFILE_DEV_DEBUG: '0'

defaults:
  run:
    shell: bash

jobs:
  # Decides which jobs below run, from the files changed since code this CI
  # last checked, so that a website-only change does not wait for (or
  # occupy) macOS runners. The run itself always happens and passes with
  # skipped jobs, because a release waits for a passing CI run on its exact
  # commit.
  #
  # On main the comparison starts at the newest earlier commit whose CI run
  # passed, not at the previous push: when that push's run was cancelled,
  # failed or has not finished, its changes count here too. Every passing
  # run thereby vouches for all the code before it. A pull request compares
  # the commits its event recorded, so re-running an old run checks the
  # code that run checks out.
  #
  # `build` lists what cannot affect the lints, tests or app checks, rather
  # than what can: a path nobody thought of runs everything.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # compare commits
      actions: read # find main's commits whose CI passed
    outputs:
      workflows: ${{ steps.classify.outputs.workflows }}
      build: ${{ steps.classify.outputs.build }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all() {
            echo "$1: running every job"
            printf 'workflows=true\nbuild=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          case $EVENT in
            pull_request) from=$BASE to=$HEAD ;;
            push)
              to=$SHA
              # main's commits whose CI passed, from its newest 100 passing runs.
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
                --jq '.workflow_runs[].head_sha' | sort -u > passed
              # The newest of this commit's ancestors among them.
              from=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$SHA&per_page=100" --jq '.[1:][].sha' |
                grep -Fxf passed -m1 || true)
              [[ -n $from ]] || all "no passing CI run among this commit's last 100 ancestors"
              ;;
            *) all "$EVENT" ;;
          esac
          echo "Changes from $from to $to:"
          compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$from...$to")
          # The API lists at most 300 files.
          (( $(jq '.files | length' <<<"$compare") < 300 )) || all "300 files or more"
          # Renames count under both names.
          files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<<"$compare")
          echo "$files"
          workflows=false
          build=false
          while IFS= read -r file; do
            [[ -n $file ]] || continue
            [[ $file != .github/* ]] || workflows=true
            case $file in
              # TOML anywhere is formatted by the lint job (taplo).
              *.toml) build=true ;;
              # Read by nothing that is built, linted or checked here.
              website/* | homebrew/* | LICENSE | README.md | AGENTS.md | CLAUDE.md) ;;
              docs/*.md | docs/hero/*) ;;
              # Packaging: package.yml checks these.
              scripts/release/* | assets/macos/*) ;;
              # Other workflows: zizmor checks these.
              .github/*) [[ $file != .github/workflows/ci.yml ]] || build=true ;;
              *) build=true ;;
            esac
          done <<<"$files"
          printf 'workflows=%s\nbuild=%s\n' "$workflows" "$build" | tee -a "$GITHUB_OUTPUT"

  # Audits the workflows themselves: template injection, over-broad
  # permissions, unpinned actions, persisted credentials, cache poisoning.
  zizmor:
    name: Workflow security
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          online-audits: false

  # Everything that needs no native build: formatting, the Luau types, the
  # Wasm providers.
  lint:
    name: Format, Luau types, and providers
    needs: [changes, zizmor]
    if: >-
      !cancelled() && needs.changes.outputs.build == 'true' &&
      (needs.zizmor.result == 'success' || needs.zizmor.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchains
        run: |
          rustup toolchain install
          nightly=$(sed -n 's/^nightly_toolchain := "\(.*\)"/\1/p' justfile)
          rustup toolchain install "$nightly" --profile minimal --component rustfmt
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.58.0,taplo@0.10.0
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          # `just providers` builds into target/providers.
          cache-directories: target/providers
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting (Rust and TOML)
        run: just format-check
      - name: Check Cargo.lock is in sync
        run: just lockfile-check
      - name: Type-check the app's Luau
        run: just types
      - name: Type-check the example apps' Luau
        run: just types examples
      - name: Lint and build the Wasm providers
        run: just providers
      - name: Lint and build the example apps' Wasm providers
        run: just providers-examples

  # Lints, tests and the headless app check on every platform the release
  # ships for.
  checks:
    name: Lint and test (${{ matrix.runner }})
    needs: [changes, zizmor]
    if: >-
      !cancelled() && needs.changes.outputs.build == 'true' &&
      (needs.zizmor.result == 'success' || needs.zizmor.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The `ghostty` terminal builds libghostty-vt with Zig (see mise.toml).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint every target and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Load every built-in module headlessly
        run: cargo run --locked -p moonframe-app -- --check --no-user app
      - name: Load every example app headlessly
        run: |
          cargo build --locked -p moonframe-app -p moonframe-host-example
          scripts/check-examples.sh "target/debug/moonframe$EXE" "target/debug/host-example$EXE"
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Check the component catalogue skill is current
        run: |
          mkdir -p target
          cargo run --quiet --locked -p moonframe-app -- --no-user --catalogue app > target/components.md
          # --strip-trailing-cr: Git for Windows checks the skill out with CRLF.
          diff -u --strip-trailing-cr .claude/skills/moonframe-components/SKILL.md target/components.md

  # One stable context for branch protection: every job above passed, or
  # was skipped because Changes found nothing for it to check.
  ci-passed:
    name: CI passed
    needs: [changes, zizmor, lint, checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          test "$CHANGES" = success
          for result in $RESULTS; do
            [[ $result == success || $result == skipped ]]
          done
