name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; every job below declares the scopes it needs.
permissions: {}

# A newer push cancels a pull request's run, but every commit on main gets
# a run of its own that finishes: a release requires a complete CI run for
# its exact commit, and in one shared group a newer push would replace a
# run still queued.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Smaller caches and faster builds; panics still report file and line.
  CARGO_PROFILE_DEV_DEBUG: '0'

defaults:
  run:
    shell: bash

jobs:
  # Decides which jobs below run, from the files changed since code this CI
  # last checked, so that a website-only change does not wait for (or
  # occupy) macOS runners. The run itself always happens and passes with
  # skipped jobs, because a release waits for a passing CI run on its exact
  # commit.
  #
  # On main the comparison starts at the newest earlier commit whose CI run
  # passed, not at the previous push: when that push's run was cancelled,
  # failed or has not finished, its changes count here too. Every passing
  # run thereby vouches for all the code before it. A pull request compares
  # the commits its event recorded, so re-running an old run checks the
  # code that run checks out.
  #
  # `build` lists what cannot affect the lints, tests or app checks, rather
  # than what can: a path nobody thought of runs everything. The website
  # (and netlify.toml, which only Netlify reads) sets `site` instead, so its
  # scripts and TOML get the repository-wide checks on one small runner
  # rather than every platform's build.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # compare commits
      actions: read # find main's commits whose CI passed
    outputs:
      workflows: ${{ steps.classify.outputs.workflows }}
      build: ${{ steps.classify.outputs.build }}
      site: ${{ steps.classify.outputs.site }}
      guide: ${{ steps.classify.outputs.guide }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all() {
            echo "$1: running every job"
            printf 'workflows=true\nbuild=true\nsite=true\nguide=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          case $EVENT in
            pull_request) from=$BASE to=$HEAD ;;
            push)
              to=$SHA
              # main's commits whose CI passed, from its newest 100 passing runs.
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
                --jq '.workflow_runs[].head_sha' | sort -u > passed
              # The newest of this commit's ancestors among them.
              from=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$SHA&per_page=100" --jq '.[1:][].sha' |
                grep -Fxf passed -m1 || true)
              [[ -n $from ]] || all "no passing CI run among this commit's last 100 ancestors"
              ;;
            *) all "$EVENT" ;;
          esac
          echo "Changes from $from to $to:"
          compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$from...$to")
          # The API lists at most 300 files.
          (( $(jq '.files | length' <<<"$compare") < 300 )) || all "300 files or more"
          # Renames count under both names.
          files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<<"$compare")
          echo "$files"
          workflows=false
          build=false
          site=false
          guide=false
          while IFS= read -r file; do
            [[ -n $file ]] || continue
            [[ $file != .github/* ]] || workflows=true
            # The WASM guide page is generated from its Markdown by a tool
            # in website/tools; a change to any of them, or to this workflow,
            # checks it is still current.
            case $file in
              website/* | docs/wasm-providers.md | .github/workflows/ci.yml) guide=true ;;
            esac
            case $file in
              # Built by nothing here, wherever its scripts or TOML are: the
              # site job checks their size, sort markers and formatting.
              website/* | netlify.toml) site=true ;;
              # TOML anywhere else is formatted by the lint job (taplo).
              *.toml) build=true ;;
              # The checks job holds the file size limit, which covers these
              # wherever they are, the paths skipped below included.
              *.rs | *.py | *.sh | *.swift | *.luau) build=true ;;
              # Read by nothing that is built, linted or checked here.
              homebrew/* | LICENSE | README.md | AGENTS.md | CLAUDE.md) ;;
              docs/*.md | docs/hero/*) ;;
              # Packaging: package.yml checks these.
              scripts/release/* | assets/macos/*) ;;
              # Other workflows: zizmor checks these.
              .github/*) [[ $file != .github/workflows/ci.yml ]] || build=true ;;
              *) build=true ;;
            esac
          done <<<"$files"
          printf 'workflows=%s\nbuild=%s\nsite=%s\nguide=%s\n' "$workflows" "$build" "$site" "$guide" | tee -a "$GITHUB_OUTPUT"

  # Audits the workflows themselves: template injection, over-broad
  # permissions, unpinned actions, persisted credentials, cache poisoning.
  zizmor:
    name: Workflow security
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          online-audits: false

  # Everything that needs no native build: formatting, the Luau types, the
  # Wasm providers.
  lint:
    name: Format, Luau types, and providers
    needs: [changes, zizmor]
    if: >-
      !cancelled() && needs.changes.outputs.build == 'true' &&
      (needs.zizmor.result == 'success' || needs.zizmor.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchains
        run: |
          rustup toolchain install
          nightly=$(sed -n 's/^nightly_toolchain := "\(.*\)"/\1/p' justfile)
          rustup toolchain install "$nightly" --profile minimal --component rustfmt
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.58.0,taplo@0.10.0
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          # `just providers` builds into target/providers.
          cache-directories: target/providers
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting (Rust and TOML)
        run: just format-check
      - name: Check the keep-sorted regions
        run: just check-sorted
      - name: Check Cargo.lock is in sync
        run: just lockfile-check
      - name: Type-check the app's Luau
        run: just types
      - name: Type-check the example apps' Luau
        run: just types examples
      - name: Lint and build the Wasm providers
        run: just providers
      - name: Lint and build the example apps' Wasm providers
        run: just providers-examples

  # Lints, tests and the headless app check on every platform the release
  # ships for.
  checks:
    name: Lint and test (${{ matrix.runner }})
    needs: [changes, zizmor]
    if: >-
      !cancelled() && needs.changes.outputs.build == 'true' &&
      (needs.zizmor.result == 'success' || needs.zizmor.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the file size limit
        # The checks job has no `just`; this is the script `just check-file-size` runs.
        run: scripts/check-file-size.sh
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # Defender scans every file Cargo writes, which makes a cold Windows
      # build several times slower. The runner is thrown away afterwards.
      - name: Stop Windows Defender scanning the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      # The `ghostty` terminal builds libghostty-vt with Zig (see mise.toml).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # Four platforms' caches overflow the repository's 10 GB, so they
      # evicted each other and runs built cold. ARM Linux, the largest,
      # builds cold every time instead, beside the `rune` and `features` jobs
      # that take as long.
      # `shared-key`, which `features` and `rune` restore by: with it,
      # rust-cache leaves out the job's name and `key`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.runner != 'ubuntu-24.04-arm' }}
      - name: Lint every target and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      # Pilot's provider against a real pi and a mock model on a local port:
      # no key, no network past the download. Pinned by version and hash;
      # move both together (SHA256SUMS on pi's release has the hash).
      - name: Install pi
        if: matrix.runner == 'ubuntu-24.04'
        env:
          PI_VERSION: 1.5.0
          PI_SHA256: df870ba0e344cb7b3358d8d8f19397b8b8d225a8669784736ad68a5c2169d53b
        run: |
          curl -fsSL --retry 5 --retry-delay 15 -o "$RUNNER_TEMP/pi.tar.gz" \
            "https://github.com/earendil-works/pi/releases/download/v$PI_VERSION/pi-linux-x64.tar.gz"
          echo "$PI_SHA256  $RUNNER_TEMP/pi.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pi.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pi/pi" --version
          echo "PILOT_PI=$RUNNER_TEMP/pi/pi" >> "$GITHUB_ENV"
      - name: Test Pilot against the real pi
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo test --locked -p moonframe-pi -- --include-ignored
      # A workspace build unifies features and can hide accidental defaults.
      # The dependency boundaries differ by platform, so every runner checks
      # them (from `cargo tree`, without building); the `features` job
      # builds each capability on its own.
      - name: Check the capability dependency boundaries
        run: python3 scripts/check-features.py
      - name: Load every built-in module headlessly
        run: cargo run --locked -p moonframe-app -- --check --no-user app
      - name: Load every example app headlessly
        run: |
          cargo build --locked -p moonframe-app -p moonframe-host-example
          scripts/check-examples.sh "target/debug/moonframe$EXE" "target/debug/host-example$EXE"
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Check the component catalogue skill is current
        run: |
          mkdir -p target
          cargo run --quiet --locked -p moonframe-app -- --no-user --catalogue app > target/components.md
          # --strip-trailing-cr: Git for Windows checks the skill out with CRLF.
          diff -u --strip-trailing-cr .claude/skills/moonframe-components/SKILL.md target/components.md

  # The repository-wide checks a website change can break, without building
  # anything. When `build` is set, lint and checks run these already.
  site:
    name: Site checks
    needs: [changes, zizmor]
    if: >-
      !cancelled() && needs.changes.outputs.site == 'true' &&
      needs.changes.outputs.build != 'true' &&
      (needs.zizmor.result == 'success' || needs.zizmor.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: taplo@0.10.0
          fallback: none
      - name: Check the file size limit
        run: scripts/check-file-size.sh
      - name: Check the keep-sorted regions
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_check_sorted.py
          python3 scripts/check-sorted.py
      - name: Check TOML formatting
        run: taplo fmt --check

  # docs.moonframe.dev's WASM guide is generated from docs/wasm-providers.md
  # by website/tools/wasm-guide.py: fail when the committed page is not what
  # the tool renders now. Its own job, as it runs whether or not `build` is.
  wasm-guide:
    name: WASM guide is current
    needs: [changes, zizmor]
    if: >-
      !cancelled() && needs.changes.outputs.guide == 'true' &&
      (needs.zizmor.result == 'success' || needs.zizmor.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tool's one dependency, pinned as in its script header, by hash.
      - name: Install Markdown
        run: |
          python3 -m venv "$RUNNER_TEMP/guide"
          printf 'Markdown==3.8.2 --hash=sha256:5c83764dbd4e00bdd94d85a19b8d55ccca20fe35b2e678a1422b380324dd5f24\n' > "$RUNNER_TEMP/guide.txt"
          "$RUNNER_TEMP/guide/bin/pip" install --quiet --disable-pip-version-check --no-deps --only-binary :all: --require-hashes -r "$RUNNER_TEMP/guide.txt"
      - name: Check the WASM guide page matches its Markdown
        run: '"$RUNNER_TEMP/guide/bin/python" website/tools/wasm-guide.py --check'

  # Each capability on its own, and the minimal builds: about thirty builds
  # of the app with their own dependencies. Platform-neutral enough for one
  # runner, and beside `checks` rather than after it, so a cold run is not
  # their sum.
  features:
    name: Capability builds (${{ matrix.shard }}/3)
    needs: [changes, zizmor]
    if: >-
      !cancelled() && needs.changes.outputs.build == 'true' &&
      (needs.zizmor.result == 'success' || needs.zizmor.result == 'skipped')
    # A third of the selections each, side by side.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Stop Windows Defender scanning the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # The `checks` job's cache, read only: most dependencies are built the
      # same, and saving another cache per job would overflow the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks
          save-if: false
      - name: Lint each capability on its own
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/check-features.py --lint --shard "$SHARD/3"
      - name: Test the minimal builds
        if: matrix.shard == 1
        run: |
          cargo test --locked -p moonframe --no-default-features
          cargo test --locked -p moonframe-packages --no-default-features
          cargo test --locked -p moonframe-providers
          cargo clippy --locked -p moonframe-mux --no-default-features --features herdr-core --all-targets -- -D warnings

  # The Rune build is its own selection: linking no GPUI is what it is for,
  # so its tests and every example run without GPUI's features. Beside
  # `checks`, on Linux and macOS: the renderer is experimental, and its
  # Windows and ARM builds took as long as the rest of CI.
  rune:
    name: Rune build (${{ matrix.runner }})
    needs: [changes, zizmor]
    if: >-
      !cancelled() && needs.changes.outputs.build == 'true' &&
      (needs.zizmor.result == 'success' || needs.zizmor.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # The `checks` job's cache, read only: most dependencies are built the
      # same, and saving another cache per job would overflow the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks
          save-if: false
      - name: Test the Rune build
        run: scripts/check-rune.sh

  # Each change to Cargo.lock (or the toolchain) keys a new Rust cache, and
  # the old ones stay until GitHub evicts something to stay under its 10 GB:
  # often another platform's current cache, whose next run then builds
  # cold. On main, once the caches are saved, drop those superseded.
  prune-caches:
    name: Prune superseded caches
    needs: [lint, checks, features, rune]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.checks.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # delete caches
    steps:
      - name: Delete main's older caches of each kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Newest first; a Rust cache's kind is its key without the two
          # trailing hashes (environment and Cargo.lock).
          gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --limit 100 \
            --sort created_at --order desc --json id,key --jq '.[] | "\(.id) \(.key)"' |
            while read -r id key; do
              case $key in
                v0-rust-*) kind=${key%-*-*} ;;
                *) kind=$key ;;
              esac
              if [[ " ${seen:-} " == *" $kind "* ]]; then
                echo "delete $key"
                gh cache delete --repo "$GITHUB_REPOSITORY" "$id"
              else
                seen="${seen:-} $kind"
              fi
            done

  # One stable context for branch protection: every job above passed, or
  # was skipped because Changes found nothing for it to check.
  ci-passed:
    name: CI passed
    needs: [changes, zizmor, lint, checks, features, rune, site, wasm-guide]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          test "$CHANGES" = success
          for result in $RESULTS; do
            [[ $result == success || $result == skipped ]]
          done
