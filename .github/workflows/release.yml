name: Release
run-name: Release @ ${{ inputs.expected_sha }}

# Publishes main's HEAD as v<workspace version from Cargo.toml>. Start it with
# `just release`, which bumps nothing: set the version in Cargo.toml first.
#
# Nothing is signed, attested or published until CI has passed on the exact
# commit. Credentials live only in the protected `release` environment, and
# only the jobs that need them enter it.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA of main's HEAD, the commit to release
        required: true
        type: string

permissions: {}

# Serialize releases; never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Workflow security
    if: >-
      github.repository == 'moonframehq/moonframe' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          online-audits: false

  validate:
    name: Validate the request
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
      macos_signed: ${{ steps.macos-signing.outputs.signed }}
      windows_signed: ${{ steps.windows-signing.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: validate
        name: Require main's HEAD and a version not released yet
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$EXPECTED_SHA" ]]
          version=$(scripts/release/version.sh)
          for path in "git/ref/tags/v$version" "releases/tags/v$version"; do
            if gh api "repos/$GITHUB_REPOSITORY/$path" --silent 2>/dev/null; then
              echo "::error::v$version already exists ($path); bump the version in Cargo.toml"
              exit 1
            fi
          done
          printf 'sha=%s\nversion=%s\n' "$EXPECTED_SHA" "$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version from $EXPECTED_SHA"
      # Developer ID signing is on once MACOS_SIGNING_IDENTITY is set (with
      # the release environment's secrets, see docs/releasing.md). Until then
      # the disk image ships signed ad hoc, and Gatekeeper asks users to
      # approve it on first launch.
      - id: macos-signing
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -n "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_SIGNING_IDENTITY is not set: the macOS disk image ships without Developer ID signing or notarization"
          fi
      # Authenticode signing (Azure Artifact Signing) is on once
      # WINDOWS_SIGNING_SUBJECT is set, see docs/releasing.md. Until then the
      # zip's executable is unsigned and SmartScreen warns on first launch.
      - id: windows-signing
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          if [[ -n "$WINDOWS_SIGNING_SUBJECT" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WINDOWS_SIGNING_SUBJECT is not set: the Windows zip ships without Authenticode signing"
          fi

  # Packaging overlaps CI so the two do not add up, but nothing is signed or
  # published until this job has seen CI pass on the commit.
  ci-gate:
    name: Require CI on this commit
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write # cancel other commits' CI runs, re-run this one's
    steps:
      # macOS runners are few: CI runs of main's other commits, which this
      # release does not wait for, would hold them while this release's own
      # CI run and macOS package queue behind. Only CI runs of pushes to main
      # are cancelled; pull requests keep theirs.
      - name: Cancel the CI runs of main's other commits
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          for status in requested queued pending waiting in_progress; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=$status&per_page=100" \
              --jq '.workflow_runs[] | select(.head_sha != env.SHA) | "\(.id) \(.head_sha)"'
          done | sort -u > others
          while read -r id sha; do
            echo "Cancelling CI run $id of $sha"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" --silent || true
          done < others
          # A run with some jobs done and others still queued can ignore a
          # plain cancel; force those.
          sleep 30
          while read -r id _; do
            if [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .status) != completed ]]; then
              echo "Force-cancelling CI run $id"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" --silent || true
            fi
          done < others
      # A run cancelled before this release started (by an earlier release,
      # or by hand) is re-run once rather than failing the release.
      - name: Wait for the CI run of this commit to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          rerun=false
          while :; do
            read -r id status conclusion < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push" \
              --jq '.workflow_runs | sort_by(.run_number) | last | if . == null then "- missing -" else "\(.id) \(.status) \(.conclusion // "-")" end')
            echo "CI: $status $conclusion"
            case "$status $conclusion" in
              "completed success") exit 0 ;;
              "completed cancelled")
                if [[ $rerun == false ]]; then
                  echo "Re-running cancelled CI run $id"
                  gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/rerun" --silent
                  rerun=true
                else
                  echo "::error::CI was cancelled again on $SHA"; exit 1
                fi ;;
              completed*) echo "::error::CI did not pass on $SHA"; exit 1 ;;
            esac
            sleep 60
          done

  package:
    name: Package
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.validate.outputs.sha }}

  sbom:
    name: SBOM
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none
      - name: Generate the CycloneDX SBOMs
        run: scripts/release/sbom.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Signs the tested app without running it, notarizes it, and rebuilds the
  # disk image around the stapled app.
  sign-macos:
    name: Sign and notarize macOS
    needs: [validate, ci-gate, package]
    if: needs.validate.outputs.macos_signed == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      # No token or run-id: artifacts can only come from this workflow run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-macos
          path: unsigned
      - name: Sign and notarize the app and disk image (never launch the app)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: scripts/release/sign-macos.sh unsigned/Moonframe.app.tar signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos
          path: signed/*.dmg
          if-no-files-found: error
          retention-days: 7

  # Signs the tested executable inside Azure (Artifact Signing, no key or
  # secret here: the release environment's OIDC token is the credential),
  # checks the signature, and zips the folder up again. Nothing is built or
  # run, and there is no checkout.
  sign-windows:
    name: Sign Windows
    needs: [validate, ci-gate, package]
    if: needs.validate.outputs.windows_signed == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # exchanged for an Azure token by azure/login (OIDC)
    env:
      NAME: Moonframe-${{ needs.validate.outputs.version }}-x86_64-pc-windows-msvc
    steps:
      # No token or run-id: artifacts can only come from this workflow run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-x86_64-pc-windows-msvc
          path: unsigned
      - name: Unpack the zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath "unsigned/$env:NAME.zip" -DestinationPath work
          if (-not (Test-Path -LiteralPath "work/$env:NAME/moonframe.exe")) { throw "moonframe.exe missing from $env:NAME.zip" }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\work\${{ env.NAME }}\moonframe.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Moonframe
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
          cache-dependencies: false
      - name: Verify every signature, then zip the folder again
        shell: pwsh
        env:
          SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath work -Recurse -File -Include *.exe, *.dll)
          if ($files.Count -eq 0) { throw 'nothing to verify' }
          foreach ($file in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate -or
                $s.SignerCertificate.Subject -ne $env:SUBJECT) {
              throw "bad signature on $($file.FullName): $($s.Status)"
            }
            "signed: $($file.Name) ($($s.SignerCertificate.Subject))"
          }
          New-Item -ItemType Directory signed | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          # Same layout as package-archive.sh: one top-level folder.
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path "work/$env:NAME").Path, "$PWD/signed/$env:NAME.zip",
            [IO.Compression.CompressionLevel]::Optimal, $true)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows
          path: signed/*.zip
          if-no-files-found: error
          retention-days: 7

  # Checksums, Sigstore signatures and GitHub attestations (SLSA build
  # provenance and the SBOM) over exactly the files users download.
  attest:
    name: Checksums, signatures, and attestations
    needs: [validate, ci-gate, package, sbom, sign-macos, sign-windows]
    # sign-macos and sign-windows are skipped while their signing is not set
    # up, and a skipped need skips this job unless its condition checks
    # results itself.
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' && needs.ci-gate.result == 'success' &&
      needs.package.result == 'success' && needs.sbom.result == 'success' &&
      (needs.sign-macos.result == 'success' ||
       (needs.validate.outputs.macos_signed == 'false' && needs.sign-macos.result == 'skipped')) &&
      (needs.sign-windows.result == 'success' ||
       (needs.validate.outputs.windows_signed == 'false' && needs.sign-windows.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore and attestation signing certificates (OIDC)
      attestations: write # store the provenance and SBOM attestations
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      MACOS_SIGNED: ${{ needs.validate.outputs.macos_signed }}
      WINDOWS_SIGNED: ${{ needs.validate.outputs.windows_signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.macos_signed == 'true'
        with:
          name: signed-macos
          path: signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.windows_signed == 'true'
        with:
          name: signed-windows
          path: signed
      - name: Collect the release files
        run: |
          set -euo pipefail
          dmg="Moonframe-$VERSION-universal-apple-darwin.dmg"
          if [[ "$MACOS_SIGNED" == true ]]; then
            mv "signed/$dmg" dist/
          else
            mv "packages/$dmg" dist/
          fi
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mv "packages/Moonframe-$VERSION-$target.tar.gz" dist/
          done
          zip="Moonframe-$VERSION-x86_64-pc-windows-msvc.zip"
          if [[ "$WINDOWS_SIGNED" == true ]]; then
            mv "signed/$zip" dist/
          else
            mv "packages/$zip" dist/
          fi
          test -s "dist/Moonframe-$VERSION.cdx.json"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the certificate binds each signature to this workflow's OIDC
      # identity, so there is no long-lived signing key to leak.
      - name: Sign every file with Sigstore
        working-directory: dist
        run: |
          set -euo pipefail
          for file in *; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/Moonframe-${{ needs.validate.outputs.version }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [validate, attest]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.attest.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the tag and the release
      attestations: read # verify the attestations before publishing
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Verify as a user would before anything becomes public.
      - name: Verify checksums, signatures, and attestations
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          for bundle in *.sigstore.json; do
            cosign verify-blob --bundle "$bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${bundle%.sigstore.json}"
          done
          while read -r _ file; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main --source-digest "$RELEASE_SHA"
          done < SHA256SUMS
      - name: Create the tag and a draft release
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -X POST \
            -f "ref=refs/tags/v$VERSION" -f "sha=$RELEASE_SHA"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Moonframe $VERSION" --generate-notes dist/*
      - name: Check the uploaded draft, then publish it
        run: |
          set -euo pipefail
          expected=$(find dist -maxdepth 1 -type f -printf "%f\n" | jq -R . | jq -sc "sort")
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets |
            jq -e --argjson expected "$expected" '.isDraft and ([.assets[].name] | sort) == $expected'
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir uploaded
          (cd uploaded && sha256sum --check --strict SHA256SUMS)
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha)" == "$RELEASE_SHA" ]]
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

  # Points moonframehq/homebrew-tap's cask at the published disk image, through
  # that repository's deploy key, which only the homebrew environment holds.
  # Only for a notarized disk image and a final (not pre-release) version.
  homebrew:
    name: Homebrew
    needs: [validate, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.validate.outputs.macos_signed == 'true' &&
      !contains(needs.validate.outputs.version, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Render the cask for the published disk image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease |
            jq -e '.isDraft == false and .isPrerelease == false'
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha)" == "$RELEASE_SHA" ]]
          dmg="Moonframe-$VERSION-universal-apple-darwin.dmg"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir final \
            --pattern "$dmg" --pattern SHA256SUMS
          (cd final && sha256sum --check --strict --ignore-missing SHA256SUMS)
          checksum=$(sha256sum "final/$dmg" | cut -d' ' -f1)
          scripts/release/render-cask.sh "$VERSION" "$checksum" > moonframe.rb
          cat moonframe.rb
      - name: Commit the cask to the tap
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: scripts/release/update-homebrew.sh "$VERSION" moonframe.rb

  # The apps with a [release] table go out as a release of their own,
  # apps-v<version>: Check for Updates reads a release's assets, so Moonframe's
  # must hold only Moonframe. These jobs start once Moonframe is published, so
  # nothing here can hold it up, and a failure is re-run on its own.
  sign-apps:
    name: Sign and notarize the apps
    needs: [validate, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.validate.outputs.macos_signed == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      # No token or run-id: artifacts can only come from this workflow run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-macos
          path: unsigned
      - name: Sign and notarize the apps (never launch them)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: scripts/release/sign-apps.sh unsigned/apps.tar signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apps
          path: signed/*.zip
          if-no-files-found: error
          retention-days: 7

  # As sign-windows does for Moonframe: signs each app's tested executable
  # inside Azure, checks every signature, and zips each folder up again.
  # Nothing is built or run, and there is no checkout.
  sign-apps-windows:
    name: Sign the apps for Windows
    needs: [validate, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.validate.outputs.windows_signed == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # exchanged for an Azure token by azure/login (OIDC)
    steps:
      # No token or run-id: artifacts can only come from this workflow run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-x86_64-pc-windows-msvc
          path: unsigned
      # Each zip in a folder of its own name, so it zips up again to the
      # same name, around the one folder it held.
      - name: Unpack the zips
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem -LiteralPath unsigned -Filter '*-x86_64-pc-windows-msvc.zip')
          if ($zips.Count -eq 0) { throw 'no Windows app in apps-x86_64-pc-windows-msvc' }
          foreach ($zip in $zips) {
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath "work/$($zip.BaseName)"
            $folders = @(Get-ChildItem -LiteralPath "work/$($zip.BaseName)" -Directory)
            if ($folders.Count -ne 1 -or
                -not (Test-Path -LiteralPath "$($folders[0].FullName)/$($folders[0].Name).exe")) {
              throw "$($zip.Name) does not hold one folder with its executable"
            }
          }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\work
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Moonframe app
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
          cache-dependencies: false
      - name: Verify every signature, then zip each folder again
        shell: pwsh
        env:
          SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath work -Recurse -File -Include *.exe, *.dll)
          if ($files.Count -eq 0) { throw 'nothing to verify' }
          foreach ($file in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate -or
                $s.SignerCertificate.Subject -ne $env:SUBJECT) {
              throw "bad signature on $($file.FullName): $($s.Status)"
            }
            "signed: $($file.Name) ($($s.SignerCertificate.Subject))"
          }
          New-Item -ItemType Directory signed | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($archive in Get-ChildItem -LiteralPath work -Directory) {
            $folder = @(Get-ChildItem -LiteralPath $archive.FullName -Directory)[0]
            # Same layout as bundle-app.sh: one top-level folder.
            [IO.Compression.ZipFile]::CreateFromDirectory(
              $folder.FullName, "$PWD/signed/$($archive.Name).zip",
              [IO.Compression.CompressionLevel]::Optimal, $true)
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apps-windows
          path: signed/*.zip
          if-no-files-found: error
          retention-days: 7

  attest-apps:
    name: Checksums, signatures, and attestations of the apps
    needs: [validate, publish, sign-apps, sign-apps-windows]
    # sign-apps and sign-apps-windows are skipped while their signing is not
    # set up.
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      (needs.sign-apps.result == 'success' ||
       (needs.validate.outputs.macos_signed == 'false' && needs.sign-apps.result == 'skipped')) &&
      (needs.sign-apps-windows.result == 'success' ||
       (needs.validate.outputs.windows_signed == 'false' && needs.sign-apps-windows.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore and attestation signing certificates (OIDC)
      attestations: write # store the provenance attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apps-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.macos_signed == 'true'
        with:
          name: signed-apps
          path: signed/macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.windows_signed == 'true'
        with:
          name: signed-apps-windows
          path: signed/windows
      # Each platform's zips by their target: signed ones in place of
      # unsigned, and neither platform's replacing the other's.
      - name: Collect the release files
        env:
          MACOS_SIGNED: ${{ needs.validate.outputs.macos_signed }}
          WINDOWS_SIGNED: ${{ needs.validate.outputs.windows_signed }}
        run: |
          set -euo pipefail
          mkdir dist
          mv packages/*.tar.gz dist/
          if [[ "$MACOS_SIGNED" == true ]]; then
            mv signed/macos/*-universal-apple-darwin.zip dist/
          else
            mv packages/*-universal-apple-darwin.zip dist/
          fi
          if [[ "$WINDOWS_SIGNED" == true ]]; then
            mv signed/windows/*-x86_64-pc-windows-msvc.zip dist/
          else
            mv packages/*-x86_64-pc-windows-msvc.zip dist/
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless, as Moonframe's own: bound to this workflow's OIDC identity.
      - name: Sign every file with Sigstore
        working-directory: dist
        run: |
          set -euo pipefail
          for file in *; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apps
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-apps:
    name: Publish the apps
    needs: [validate, attest-apps]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.attest-apps.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the tag and the release
      attestations: read # verify the attestations before publishing
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apps
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Verify as a user would before anything becomes public.
      - name: Verify checksums, signatures, and attestations
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          for bundle in *.sigstore.json; do
            cosign verify-blob --bundle "$bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${bundle%.sigstore.json}"
          done
          while read -r _ file; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main --source-digest "$RELEASE_SHA"
          done < SHA256SUMS
      # Never the latest: that stays Moonframe's, which its updates read.
      - name: Create the tag and a draft release
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -X POST \
            -f "ref=refs/tags/apps-v$VERSION" -f "sha=$RELEASE_SHA"
          gh release create "apps-v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --latest=false --title "Moonframe apps $VERSION" \
            --notes "The apps built on Moonframe $VERSION, each to install on its own." dist/*
      - name: Check the uploaded draft, then publish it
        run: |
          set -euo pipefail
          expected=$(find dist -maxdepth 1 -type f -printf "%f\n" | jq -R . | jq -sc "sort")
          gh release view "apps-v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets |
            jq -e --argjson expected "$expected" '.isDraft and ([.assets[].name] | sort) == $expected'
          gh release download "apps-v$VERSION" --repo "$GITHUB_REPOSITORY" --dir uploaded
          (cd uploaded && sha256sum --check --strict SHA256SUMS)
          gh release edit "apps-v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

  # After Moonframe's own cask, as both push to the tap.
  homebrew-apps:
    name: Homebrew casks of the apps
    needs: [validate, publish-apps, homebrew]
    if: >-
      !cancelled() && needs.publish-apps.result == 'success' &&
      needs.validate.outputs.macos_signed == 'true' &&
      !contains(needs.validate.outputs.version, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Render the casks for the published apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "apps-v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft |
            jq -e '.isDraft == false'
          gh release download "apps-v$VERSION" --repo "$GITHUB_REPOSITORY" --dir final --pattern SHA256SUMS
          scripts/release/render-app-casks.py "$VERSION" final/SHA256SUMS casks
          cat casks/*.rb
      - name: Commit the casks to the tap
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: scripts/release/update-homebrew.sh "$VERSION" casks/*.rb
