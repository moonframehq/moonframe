# moonframe.dev and docs.moonframe.dev: a static site in website/site, no build.
[build]
command = ""
publish = "website/site"
# Skip a deploy when nothing under website/ changed.
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- website/ netlify.toml"

[[headers]]
for = "/img/*"
[headers.values]
Cache-Control = "public, max-age=604800"

# The tour film and its posters; render.sh rewrites them in place.
[[headers]]
for = "/film/*"
[headers.values]
Cache-Control = "public, max-age=604800"

# Social cards are named by a hash of their bytes, so they never change in place.
[[headers]]
for = "/social/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# For coding agents; Markdown served as UTF-8 text.
[[headers]]
for = "/llms.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
