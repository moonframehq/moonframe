# Chats with coding agents: the built-in `chat` provider (crates/moonframe-
# chat). Each chat runs in Sheprd's `sheprd-acp` program (once `herdr-acp`)
# with no view of its own, found on PATH or in an installed Sheprd.app or
# Herdr.app (in /Applications or ~/Applications); the app attaches to it
# over Sheprd's chat protocol. Chats outlive the app and are attached
# again at the next launch. The agents run with your access and ask you
# before acting, unless you turn on auto-accept in a chat.
interval = 0.25
kind     = "native"

[settings]
# The agent a new chat gets when none is picked.
agent = "claude"
# The mods that may start and drive chats.
starters = ["chat"]
# Where sheprd-acp is, when it is neither on PATH nor in an installed app; a
# path that names no file is passed over for that search:
# program = "~/code/herdr-gpui/target/release/sheprd-acp"
# Switchyard draws herdr's own transcript, not the prepared `view`.
raw = true
