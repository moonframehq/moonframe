[app]
# A Halloween terminal workspace: pages of projects on the left, a grid of
# framed panes (terminals, files, processes, changes) in tabs, a pumpkin.
# `moonframe --profile lantern` opens it.
keep  = ["feedback"]
name  = "lantern"
title = "Lantern"
# The projects provider and the file-tree component.
requires = ["../projects"]

# Shipped by Moonframe's releases as an app of its own (docs/releasing.md).
[release]
cask        = "moonframe-lantern"
description = "Halloween terminal workspace with project pages and a process monitor"
