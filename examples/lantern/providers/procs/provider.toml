# What runs on this machine, for Lantern's process monitor: processes
# grouped by name with their CPU and memory, the CPU split and load, and
# memory in use. Shared as `app.procs`. On macOS it runs `ps`, `iostat`,
# `vm_stat` and `sysctl` with your access; on Linux and Windows it reads the
# same from the system directly. A native provider: Rust built into
# the app (crates/moonframe-procs, the `procs` feature), so the app needs
# nothing else installed. See its lib.rs for what it publishes.
kind = "native"
