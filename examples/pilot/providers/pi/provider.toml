# The pi coding agent: its threads, each a `pi --mode rpc` process over the
# session files pi keeps itself, so what happens here carries over to the pi
# CLI. A native provider: Rust built into the app (crates/moonframe-pi, the
# `pi` feature), so the app needs nothing else installed but pi. It runs pi
# and git with your access, and reads and writes pi's settings and
# credentials under ~/.pi/agent. See that crate for what it publishes and
# the messages it takes.
#
# A native provider has no `urgent`, `stop-grace` or `restart`: `abort` goes
# straight to pi from the provider's `receive`, ahead of whatever else is
# going on; closing stops each pi by closing its stdin, then a signal after
# 1.5 seconds; and a panic loses only what it was doing.
kind    = "native"
publish = "latest"
start   = "always"
