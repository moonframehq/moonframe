# The git checkout and files of the thread on screen: status, diffs, the file
# tree, reading and saving files, staging, committing and worktrees. A native
# provider: Rust built into the app (crates/moonframe-pi, the `pi` feature).
# It runs git and reads files with your access. See src/repo.rs there for
# what it publishes and the messages it takes.
kind    = "native"
publish = "latest"
