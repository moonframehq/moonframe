# Make it yours: the built-in `acp` provider, for the agent the sparkles
# start (the built-in mods/feedback, kept in moonframe.toml). The window
# tells it which app this is, so it changes this app's folder.
interval = 0.25
kind     = "native"

[settings]
agent    = "claude"
starters = ["feedback"]
# Reading, editing this app's folder and running its check are allowed
# once; anything else asks you (see the app's providers/acp for "all").
allow = { feedback = "app" }
