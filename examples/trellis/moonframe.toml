[app]
# A terminal multiplexer around projects and their work trees: each work
# tree keeps its own tabs of split terminals, with its source control
# beside them. `moonframe --profile trellis` opens it.
keep  = ["feedback"]
name  = "trellis"
title = "Trellis"
# The projects provider (repositories, work trees, changes, commits).
requires = ["../projects"]

# Shipped by Moonframe's releases as an app of its own (docs/releasing.md).
[release]
cask        = "moonframe-trellis"
description = "Terminal multiplexer organised around projects and work trees"
