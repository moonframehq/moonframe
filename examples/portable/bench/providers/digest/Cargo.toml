# A provider that shapes data, for examples/portable/host/examples/bench.rs:
# built to a wasm component for the `digest` folder, and linked into the
# bench for `digest-native`. Not part of the example app.
[package]
edition = "2024"
license = "MIT"
name    = "digest"
publish = false
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
moonframe-provider = { path = "../../../../../crates/moonframe-provider" }
serde_json         = "1"

# As the repository's wasm providers build.
[profile.release]
lto       = true
opt-level = "s"
strip     = true

[workspace]
