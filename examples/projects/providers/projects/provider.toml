# The git repositories under your project folders, and the changes, folders
# and files of the one an app has open; shared as `app.projects`. A native
# provider: Rust built into the app (crates/moonframe-projects, the
# `projects` feature), which documents what it publishes. It runs git and
# reads files with your access.
interval = 0.25
kind     = "native"

[settings]
# The mods that may commit, pull, push and add work trees.
writers = ["navigator", "source-control"]
