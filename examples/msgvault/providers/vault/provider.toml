# msgvault's archive, shared as `app.vault`. With a msgvault archive on this
# machine ($MSGVAULT_HOME, else ~/.msgvault, holding msgvault.db) and the
# sqlite3 command, it reads the newest messages from it, read-only (PRAGMA
# query_only). Otherwise it shows SAMPLE data from sample.json in this folder.
# A process provider (perl 5 with JSON::PP), as it reads a file of the user's.
command = ["perl", "vault.pl"]
kind    = "process"
