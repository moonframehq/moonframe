# msgvault's archive, shared as `app.vault`. With a msgvault archive on this
# machine ($MSGVAULT_HOME, else ~/.msgvault, holding msgvault.db) it reads the
# newest messages from it, read-only (mode=ro, PRAGMA query_only). Otherwise
# it shows SAMPLE data from sample.json in this folder.
# A process provider, as it reads a file of the user's. Needs python3 (3.9 or
# later; macOS gets it with the Command Line Tools), standard library only.
command = ["python3", "vault.py"]
kind    = "process"
