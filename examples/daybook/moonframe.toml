[app]
# A planner: today's tasks and events, an inbox, a month, and notes.
# `moonframe --profile daybook` opens it.
keep     = ["feedback"]
name     = "daybook"
requires = []
title    = "Daybook"

# Shipped by Moonframe's releases as an app of its own (docs/releasing.md).
[release]
cask        = "moonframe-daybook"
description = "Planner for daily tasks and events, with an inbox, a month view and notes"
