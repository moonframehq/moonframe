[app]
# Coding sessions across your repositories: a list of them, a shell in the
# one you pick, and its changes. `moonframe --profile sessions` opens it.
keep  = ["feedback"]
name  = "sessions"
title = "Sessions"
# The projects provider and the file, change and code components.
requires = ["../projects"]

# Shipped by Moonframe's releases as an app of its own (docs/releasing.md).
[release]
cask        = "moonframe-sessions"
description = "Coding sessions across your repositories, each with a shell"
