[app]
# A writing app: a library of markdown documents and a quiet page to write
# them on, with focus mode and typewriter scrolling.
# `moonframe --profile folio` opens it.
keep     = ["feedback"]
name     = "folio"
requires = []
title    = "Folio"

# Shipped by Moonframe's releases as an app of its own (docs/releasing.md).
[release]
cask        = "moonframe-folio"
description = "Quiet markdown writing app with focus and typewriter modes"
