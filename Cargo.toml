[workspace]
exclude = ["app/providers"]
members = [
  "crates/moonframe",
  "crates/moonframe-acp",
  "crates/moonframe-app",
  "crates/moonframe-core",
  "crates/moonframe-docs",
  "crates/moonframe-git",
  "crates/moonframe-history",
  "crates/moonframe-mux",
  "crates/moonframe-packages",
  "crates/moonframe-providers",
  "crates/moonframe-store",
  "crates/moonframe-terminal",
  "examples/host",
]
resolver = "2"

[workspace.package]
edition      = "2024"
license      = "MIT"
publish      = false
repository   = "https://github.com/penso/moonframe"
rust-version = "1.99"
version      = "0.1.0"

[workspace.lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
# ACP wire types for moonframe-acp; its own transport, so no async runtime.
acp                = { default-features = false, package = "agent-client-protocol-schema", version = "1.12" }
alacritty_terminal = "0.26"
block2             = "0.6"
futures            = "0.3"
gpui-kit           = "=0.8.1"
tokio              = { default-features = false, version = "1.54" }
# Crates of herdr-gpui (to be renamed), pinned to one commit. To work on
# them beside this app, patch them to a local checkout:
#   [patch."https://github.com/penso/herdr-gpui"]
#   herdr-core-client = { path = "../herdr-gpui/crates/herdr-core-client" }
herdr-client      = { git = "https://github.com/penso/herdr-gpui", rev = "9133cb18b143c9b3f12777fe69e3058eb4ecc8bf" }
herdr-core-client = { git = "https://github.com/penso/herdr-gpui", rev = "9133cb18b143c9b3f12777fe69e3058eb4ecc8bf" }
herdr-github      = { git = "https://github.com/penso/herdr-gpui", rev = "9133cb18b143c9b3f12777fe69e3058eb4ecc8bf" }
herdr-vcs         = { git = "https://github.com/penso/herdr-gpui", rev = "9133cb18b143c9b3f12777fe69e3058eb4ecc8bf" }
# `ui.image` zooms by the picture's own size, read from its header.
imagesize                = "0.14"
libghostty-vt            = "0.2.2"
mlua                     = { features = ["luau"], version = "0.12.2" }
moonframe                = { path = "crates/moonframe" }
moonframe-acp            = { path = "crates/moonframe-acp" }
moonframe-core           = { path = "crates/moonframe-core" }
moonframe-docs           = { path = "crates/moonframe-docs" }
moonframe-git            = { path = "crates/moonframe-git" }
moonframe-history        = { path = "crates/moonframe-history" }
moonframe-mux            = { default-features = false, path = "crates/moonframe-mux" }
moonframe-packages       = { path = "crates/moonframe-packages" }
moonframe-providers      = { path = "crates/moonframe-providers" }
moonframe-store          = { path = "crates/moonframe-store" }
moonframe-terminal       = { default-features = false, path = "crates/moonframe-terminal" }
notify                   = "8"
objc2                    = "0.6"
objc2-app-kit            = { default-features = false, features = ["NSApplication", "NSImage", "NSResponder", "std"], version = "0.3" }
objc2-foundation         = { default-features = false, features = ["NSAttributedString", "NSBundle", "NSData", "NSDictionary", "NSProcessInfo", "NSString", "std"], version = "0.3" }
objc2-user-notifications = { default-features = false, features = ["UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNUserNotificationCenter", "block2", "std"], version = "0.3" }
objc2-web-kit            = { default-features = false, features = ["WKWebView", "objc2-app-kit", "std"], version = "0.3" }
portable-pty             = "0.9"
rusqlite                 = { features = ["bundled"], version = "0.41" }
# Swapping a saved file into place atomically (moonframe-docs).
rust-embed         = { features = ["include-exclude"], version = "8.7" }
rustix             = { default-features = false, features = ["fs", "std"], version = "1.1" }
serde              = { features = ["derive"], version = "1" }
serde_json         = "1"
sysinfo            = { default-features = false, features = ["network", "system"], version = "0.39" }
tempfile           = "3"
thiserror          = "2"
toml               = "1"
tracing            = "0.1"
tracing-subscriber = { default-features = false, features = ["ansi", "env-filter", "fmt", "std"], version = "0.3" }
# Check for Updates: GitHub's releases API and the download (moonframe).
ureq          = "3.5"
wasmtime      = "50"
wasmtime-wasi = "50"
# The native web views behind `ui.browser` (WebKit, WebView2): a fork of
# wry that renders under GPUI.
wry = { default-features = false, package = "lb-wry", version = "=0.53.3" }

[profile.dev.package."*"]
# GPUI and Luau are unusably slow unoptimised; keep our own crates debuggable.
opt-level = 2

[profile.release]
codegen-units = 16
lto           = "thin"
