# Note: For VS Code, if this file is changed, the evenBetterToml extension needs
# to be reloaded to pick up the changes. To do this, type ⌘ + ⇧ + P to enter the
# Command Palette, and chose "Reload Window".
#
# https://taplo.tamasfe.dev/configuration/formatter-options.html

# Build output holds dependencies' own TOML (Ghostty's sources, for one).
exclude = ["target/**"]

[formatting]
align_comments        = false
align_entries         = true
allowed_blank_lines   = 1
array_auto_expand     = true
column_width          = 100
inline_table_expand   = false
reorder_arrays        = true
reorder_inline_tables = true
reorder_keys          = true

# Disable array reordering for cargo-deb assets (format is [source, dest, mode])
[[rule]]
include = ["**/Cargo.toml"]
keys    = ["package.metadata.deb"]
[rule.formatting]
reorder_arrays = false

# A process provider's `command` is a program and its arguments, in order;
# never sort arrays in provider manifests.
[[rule]]
include = ["**/provider.toml"]
[rule.formatting]
reorder_arrays = false
