# Diagrams agents show and the project's own, shared as `app.diagrams = {
# available, agents, project, diagrams }`, newest first. Each diagram is
# `{ key, id, title, from ("agent" or "project"), path, revision, updated,
# document (what `ui.diagram`'s `document` takes), highlight, note?,
# agent?, language?, text?, error?, truncated? }`.
#
# Agents show them through `moonframe mcp diagrams`, an MCP server offered
# to every agent this app starts (and any other agent given the command):
# its tools write one file per diagram to `folder`. The project's
# `.moonframe/diagrams/*.mmd`, `.dot` and `.json` are read too.
# `{ close = "<key>" }` removes an agent's diagram, one the MCP server
# wrote (`agent/<id>.json`).
# A native provider: Rust built into the app (crates/moonframe-diagrams,
# the `diagram` feature).
interval = 1.0
kind     = "native"

[settings]
# Where agents' diagrams go; empty for the cache folder's
# `moonframe/diagrams` (or $MOONFRAME_DIAGRAMS).
folder = ""
