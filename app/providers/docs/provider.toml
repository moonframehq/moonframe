# The project's text files, read and saved for the mods that edit them (the
# markdown editor), shared as `app.docs = { available, root }`. The root is
# the one the files provider lists: MOONFRAME_FILES, else the repository of
# the terminal last used, else the repository the app runs from.
# Mods ask it `{ read = "<path>", id }` and `{ write = "<path>", text,
# version, force, id }`; it answers the mod that asked with `{ reply = id,
# action, ok, path, text | version | error, conflict }`, and tells a mod
# `{ changed = "<path>", version }` when a file it read changes on disk.
# A native provider: Rust built into the app (crates/moonframe-docs, the
# `docs` feature), reading and writing with your own access.
interval = 1.0
kind     = "native"

[settings]
# The mods that may save files, with the components they draw; any other is
# refused. The editor saves only when the user asks (⌘S or Save).
writers = ["editor"]
