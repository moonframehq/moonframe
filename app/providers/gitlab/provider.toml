# The app repository's GitLab state, shared as `app.gitlab` in the github
# provider's shape: merge requests under `prs`, `current_pr` and
# `branches`, open issues, the signed-in viewer, and `auth`. It reports
# `available = false` unless a remote is on GitLab: gitlab.com,
# $GITLAB_HOST, or a host listed in `hosts` (never a guess from the name,
# so a look-alike host gets no sign-in).
# A native provider: Rust built into the app (crates/moonframe-forge, the
# `forge` feature), calling GitLab's API (gitlab.com or your instance)
# with your own sign-in. It takes the github provider's messages; `use_cli`
# reads glab's token.
interval = 1.0
kind     = "native"

[settings]
# The mods that may sign in and out; any other is refused.
accounts = ["forge"]
# The application id device sign-ins on gitlab.com go through:
# Moonframe's own, which every app may use. An app may set its own (a
# non-confidential application with scopes read_api and read_user), or
# MOONFRAME_GITLAB_CLIENT_ID. Self-hosted instances need one of their own:
# client_ids = { "gitlab.example.com" = "..." }
client_id = "8cac6a8a1722b18c0787b58eeb40eed9e255f671407fc98679d82ba78cb966d1"
# Self-hosted GitLab hosts to sign in to, with the port when the remote
# names one ("git.example.com:8443"). GITLAB_TOKEN goes only to
# $GITLAB_HOST when set, otherwise gitlab.com.
hosts = []
# Seconds between reads of GitLab, 15 to 3600.
poll = 60
