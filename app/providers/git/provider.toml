# The git state of the folder the app runs from, shared as `app.git`:
# branch, ahead/behind, changed files with +/- counts, HEAD, worktrees,
# recent branches, remote and stashes, and one file's diff on request.
# A process provider: it runs with your own access, unlike a wasm one.
# Needs bash (3.2 or later) and git; on Windows, a bash such as Git Bash.
command = ["bash", "git.sh"]
kind    = "process"
