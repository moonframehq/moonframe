# The git state of the folder the app runs from, shared as `app.git`:
# branch, ahead/behind, changed files with +/- counts, HEAD, worktrees,
# recent branches, remote and stashes, and one file's diff on request.
# Mods also ask it to commit (`{ commit = "message", id = ... }`) or push
# (`{ push = true, id = ... }`); it answers the mod that asked with
# `{ reply = id, action, ok, message | error }`.
# A native provider: Rust built into the app (crates/moonframe-git, the
# `git` feature), running git through herdr-vcs with your own access.
interval = 1.0
kind     = "native"
