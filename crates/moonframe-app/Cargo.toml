[package]
default-run            = "moonframe"
description            = "The Moonframe starter app: the window on app/, with ~/.config/moonframe over it"
edition.workspace      = true
license.workspace      = true
name                   = "moonframe-app"
publish.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[[bin]]
name = "moonframe"
path = "src/main.rs"

[[bin]]
name              = "moonframe-patterns"
path              = "src/patterns.rs"
required-features = ["patterns"]

[features]
# Keep the starter's full experience, while allowing an explicitly lean build.
default = [
  # keep-sorted start
  "acp",
  "alacritty",
  "awake",
  "browser",
  "chat",
  "crash",
  "displays",
  "dock",
  "docs",
  "documents",
  "forge",
  "ghostty",
  "git",
  "guard",
  "herdr-core",
  "map",
  "markdown",
  "math",
  "pi",
  "procs",
  "projects",
  "prose",
  "restart",
  "shell",
  "socket",
  "speech",
  "studio",
  "tokio",
  "updates",
  "usage",
  "video",
  "wasm",
  # keep-sorted end
]
# keep-sorted start
acp           = ["moonframe/acp"]
alacritty     = ["moonframe/alacritty"]
awake         = ["moonframe/awake"]
browser       = ["moonframe/browser"]
capture       = ["moonframe/capture"]
chat          = ["moonframe/chat"]
crash         = ["moonframe/crash"]
displays      = ["moonframe/displays"]
dock          = ["moonframe/dock"]
docs          = ["moonframe/docs"]
documents     = ["moonframe/documents"]
forge         = ["moonframe/forge"]
ghostty       = ["moonframe/ghostty"]
git           = ["moonframe/git"]
guard         = ["moonframe/guard"]
herdr-core    = ["moonframe/herdr-core"]
map           = ["moonframe/map"]
map-benchmark = ["moonframe/map-benchmark"]
markdown      = ["moonframe/markdown"]
math          = ["moonframe/math"]
pi            = ["moonframe/pi"]
procs         = ["moonframe/procs"]
projects      = ["moonframe/projects"]
prose         = ["moonframe/prose"]
restart       = ["moonframe/restart"]
sealed        = ["moonframe/sealed"]
shell         = ["moonframe/shell"]
socket        = ["moonframe/socket"]
speech        = ["moonframe/speech"]
studio        = ["moonframe/studio"]
syntax        = ["moonframe/syntax"]
terminal      = ["moonframe/terminal"]
tokio         = ["moonframe/tokio"]
updates       = ["moonframe/updates"]
usage         = ["moonframe/usage"]
video         = ["moonframe/video"]
wasm          = ["moonframe/wasm"]
# keep-sorted end
# A separate developer app. Its catalog and sources never enter the starter
# or an app built on the moonframe library.
patterns = ["moonframe/default"]
# Native preview export, also excluded from ordinary builds.
pattern-capture = ["moonframe/capture", "patterns"]

[dependencies]
# Keep this explicit: other workspace hosts use the library's defaults.
moonframe = { default-features = false, path = "../moonframe" }
