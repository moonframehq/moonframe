[package]
default-run            = "moonframe"
description            = "The Moonframe starter app: the window on app/, with ~/.config/moonframe over it"
edition.workspace      = true
license.workspace      = true
name                   = "moonframe-app"
publish.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[[bin]]
name = "moonframe"
path = "src/main.rs"

[[bin]]
name              = "moonframe-patterns"
path              = "src/patterns.rs"
required-features = ["patterns"]

[features]
# Every terminal emulator the library has; `ghostty` needs Zig.
default = ["moonframe/default", "moonframe/ghostty", "moonframe/map"]
# A separate developer app. Its catalog and sources never enter the starter
# or an app built on the moonframe library.
patterns = ["moonframe/default"]
# Native preview export, also excluded from ordinary builds.
pattern-capture = ["moonframe/capture", "patterns"]

[dependencies]
moonframe = { default-features = false, path = "../moonframe" }
