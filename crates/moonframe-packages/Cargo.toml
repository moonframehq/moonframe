[package]
description            = "Moonframe's packages, profiles' folders, updates and bundles, without the window"
edition.workspace      = true
license.workspace      = true
name                   = "moonframe-packages"
publish.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
default = ["updates"]
sealed  = []
# Network release checks and installation, independent of package metadata.
updates = ["dep:ureq"]
# A bundle prebuilds its Wasm providers only when the app it bundles can
# run them: set by `moonframe/wasm`.
wasm = []

[dependencies]
moonframe-core.workspace      = true
moonframe-providers.workspace = true
serde.workspace               = true
serde_json.workspace          = true
tempfile.workspace            = true
toml.workspace                = true
tracing.workspace             = true
ureq                          = { optional = true, workspace = true }
