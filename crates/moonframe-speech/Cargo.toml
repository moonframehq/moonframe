[package]
description            = "The `speech` native provider: dictation for mods, from the microphone through a local or remote speech-to-text engine"
edition.workspace      = true
license.workspace      = true
name                   = "moonframe-speech"
publish.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
cpal                          = "0.18"
moonframe-core.workspace      = true
moonframe-providers.workspace = true
serde_json.workspace          = true
tempfile.workspace            = true
tracing.workspace             = true
ureq.workspace                = true

# Apple's on-device recognizer.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace  = true
objc2-foundation = { features = ["NSError", "NSLocale", "NSOperation", "NSURL"], workspace = true }
objc2-speech     = { default-features = false, features = ["SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription", "block2", "std"], version = "0.3" }

[dev-dependencies]
toml.workspace = true
