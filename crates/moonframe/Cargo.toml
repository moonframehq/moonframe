[package]
description            = "A window laid out by Luau: the library apps build on"
edition.workspace      = true
license.workspace      = true
name                   = "moonframe"
publish.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# The `acp` native provider (`app.acp`): coding agents run for mods over
# the Agent Client Protocol.
acp = ["dep:moonframe-acp"]
# The terminal emulators `ui.terminal` can run on. `ghostty` builds
# libghostty-vt with Zig (see mise.toml), so an app on the
# library opts into it; the starter (crates/moonframe-app) has both.
alacritty = ["moonframe-terminal/alacritty", "terminal"]
# `app:awake`: keeping the machine from sleeping while a long job runs. Off
# by default; the starter turns it on, and so do sealed apps that ask for it.
awake = ["dep:keepawake"]
# Native web views for `ui.browser` (WebKit on macOS, WebView2 on Windows).
browser = ["dep:objc2-web-kit", "dep:wry"]
# Developer-only export of this app's own rendered frame, without desktop capture,
# and `render_entry`: one miniapp entry drawn headless to PNG.
capture = ["dep:gpui-apple-capture", "dep:gpui-capture", "dep:gpui-platform-capture", "dep:image"]
# The `chat` native provider (`app.chat`): agent chats run by herdr-acp,
# attached over herdr's chat protocol.
chat = ["dep:moonframe-chat"]
default = [
  # keep-sorted start
  "acp",
  "alacritty",
  "browser",
  "chat",
  "docs",
  "forge",
  "git",
  "herdr-core",
  "markdown",
  "prose",
  "shell",
  "studio",
  "tokio",
  "updates",
  "usage",
  "wasm",
  # keep-sorted end
]
# `app.crash`: a panic leaves a report in the state folder, and the next
# launch offers it. Off by default; the starter turns it on.
crash = []
# `app.displays`, and a mod's window placed with `display` and `fullscreen`.
# Off by default; the starter turns it on.
displays = []
# `app:dock`: a badge and a progress bar on the Dock icon (macOS). Off by
# default; the starter turns it on.
dock = []
# The `docs` native provider: reads and saves the project's text files
# for the markdown editor.
docs = ["dep:moonframe-docs"]
# The `library` native provider (`app.library`): a folder of markdown
# documents, for a writing app. Off by default; the starter turns it on.
documents = ["dep:moonframe-documents"]
# The `github` and `gitlab` native providers: pull requests, checks and
# sign-in over the forges' own APIs.
forge   = ["dep:moonframe-forge"]
ghostty = ["moonframe-terminal/ghostty", "terminal"]
# The `git` native provider (`app.git`, commit and push), on herdr-vcs.
git = ["dep:moonframe-git", "moonframe-history/herdr"]
# The `shell` native provider (`app.shell`): a mod's shell commands, with
# their output in colour.
shell = ["dep:moonframe-shell"]
# The `speech` native provider (`app.speech`): dictation from the microphone
# through a local or remote engine. Off by default; the starter turns it on.
speech = ["dep:moonframe-speech"]
# `app:guard`: a mod holds back closing and quitting. Off by default; the
# starter turns it on.
guard = []
# `app:hotkey`: system-wide shortcuts for mods (macOS). Off by default; the
# starter turns it on.
hotkey = []
# State kept by herdr-core (`hc`) when installed; with `terminal`, it also
# keeps shells across launches. tmux and local PTYs only need `terminal`.
herdr-core = ["dep:moonframe-mux", "moonframe-mux/herdr-core"]
# `ui.map`: street maps from tile providers, fetched over HTTP. Off by
# default, as few apps need one; the starter turns it on, and so do sealed
# apps whose Luau uses `ui.map`.
map = ["dep:image", "dep:ureq"]
# Drives a map through input events and reports what it cost.
map-benchmark = ["map"]
# `ui.video`: frames from another process in a Metal view of their own,
# 16-bit and colour managed (macOS). Off by default: few apps need it.
video = ["dep:core-graphics-types", "dep:metal", "dep:moonframe-frames"]
# Rich read-only Markdown and the long-form writing editor are independent.
# Markdown takes `syntax`, for its code blocks.
markdown = ["dep:markdown", "syntax"]
# LaTeX in a `ui.markdown`, drawn by latex-rust, which carries its math font.
# Off by default, as few apps need one; the starter turns it on.
math = ["dep:latex-rust", "markdown"]
# The `pi` and `repo` native providers (`app.pi`, `app.repo`): threads of the
# pi coding agent and the checkout they work in, for Pilot. Off by default;
# the starter turns it on.
pi = ["dep:moonframe-pi"]
# The `planner` native provider (`app.planner`): Daybook's tasks, events and
# notes in a JSON file. Off by default; the starter turns it on.
planner = ["dep:moonframe-planner"]
# The `procs` native provider (`app.procs`): what runs on this machine,
# for Lantern's process monitor. Off by default; the starter turns it on.
procs = ["dep:moonframe-procs"]
# The `projects` native provider (`app.projects`): every repository under
# the project folders, for apps working across many. Off by default; the
# starter turns it on.
projects = ["dep:moonframe-projects"]
prose    = []
# `app:restart`, and `restart = "on-failure"` for process providers. Off by
# default; the starter turns it on.
restart = ["moonframe-providers/restart"]
# A sealed executable uses staged resources instead of the full toolbox.
sealed = ["moonframe-packages/sealed"]
# The `history` native provider (`app.history`): the coding-agent CLI's
# sessions and their transcripts, read only, for Cinder. Off by default;
# the starter turns it on.
transcripts = ["dep:moonframe-transcripts"]
# Socket providers (`kind = "socket"`): a program that runs on its own. Off
# by default; the starter turns it on.
socket = ["moonframe-providers/socket"]
# Developer Mode: development commands, the component gallery and the
# Developer tools, whose code editor colors Luau with the Lua grammar alone
# (`syntax` brings every language).
studio = ["gpui-kit/tree-sitter-lua"]
# Highlighting of code: the languages most documents show.
syntax = [
  # keep-sorted start
  "gpui-kit/tree-sitter",
  "gpui-kit/tree-sitter-bash",
  "gpui-kit/tree-sitter-c",
  "gpui-kit/tree-sitter-cpp",
  "gpui-kit/tree-sitter-css",
  "gpui-kit/tree-sitter-diff",
  "gpui-kit/tree-sitter-go",
  "gpui-kit/tree-sitter-html",
  "gpui-kit/tree-sitter-java",
  "gpui-kit/tree-sitter-javascript",
  "gpui-kit/tree-sitter-lua",
  "gpui-kit/tree-sitter-python",
  "gpui-kit/tree-sitter-ruby",
  "gpui-kit/tree-sitter-rust",
  "gpui-kit/tree-sitter-sql",
  "gpui-kit/tree-sitter-swift",
  "gpui-kit/tree-sitter-toml",
  "gpui-kit/tree-sitter-tsx",
  "gpui-kit/tree-sitter-typescript",
  "gpui-kit/tree-sitter-yaml",
  # keep-sorted end
]
# `app:status-item`: a mod's item in the menu bar, with its menu (macOS).
# Off by default; the starter turns it on.
status-item = []
# Terminal rendering and local/tmux sessions. Engines enable this too.
terminal = ["dep:moonframe-mux", "dep:moonframe-terminal", "moonframe-mux/terminal"]
# Native providers written with `async fn` (`.native_async`), and a tokio
# runtime they and the app's views share (`.tokio`, `on_runtime`).
tokio = ["moonframe-providers/tokio"]
# Release checks, downloads and in-place app updates.
updates = ["moonframe-packages/updates"]
# The `usage` native provider (`app.usage`): plan usage of the AI services
# signed in here (Claude, Codex, Copilot, ...), read by herdr-usage.
usage = ["dep:moonframe-usage"]
# Wasm providers (`kind = "wasm"`), sandboxed on wasmtime: the starter's
# `system` and providers users install. An app with none leaves it out to
# build faster and smaller.
wasm = ["moonframe-packages/wasm", "moonframe-providers/wasm"]

[dependencies]
anstream.workspace = true
anstyle.workspace  = true
# Enable export on the same GPUI version as gpui-kit, without its test harness.
futures.workspace             = true
gpui-capture                  = { default-features = false, features = ["test-support"], optional = true, package = "gpui-pre", version = "=0.3.10" }
gpui-kit.workspace            = true
gpui-platform-capture         = { default-features = false, features = ["test-support"], optional = true, package = "gpui-pre-platform", version = "=0.3.10" }
image                         = { optional = true, workspace = true }
imagesize.workspace           = true
keepawake                     = { optional = true, workspace = true }
latex-rust                    = { optional = true, workspace = true }
markdown                      = { optional = true, workspace = true }
moonframe-acp                 = { optional = true, workspace = true }
moonframe-chat                = { optional = true, workspace = true }
moonframe-core.workspace      = true
moonframe-docs                = { optional = true, workspace = true }
moonframe-documents           = { optional = true, workspace = true }
moonframe-forge               = { optional = true, workspace = true }
moonframe-git                 = { optional = true, workspace = true }
moonframe-history.workspace   = true
moonframe-mux                 = { optional = true, workspace = true }
moonframe-packages            = { default-features = false, path = "../moonframe-packages" }
moonframe-pi                  = { optional = true, workspace = true }
moonframe-planner             = { optional = true, workspace = true }
moonframe-procs               = { optional = true, workspace = true }
moonframe-projects            = { optional = true, workspace = true }
moonframe-providers.workspace = true
moonframe-shell               = { optional = true, workspace = true }
moonframe-speech              = { optional = true, workspace = true }
moonframe-store.workspace     = true
moonframe-terminal            = { optional = true, workspace = true }
moonframe-transcripts         = { optional = true, workspace = true }
moonframe-usage               = { optional = true, workspace = true }
notify.workspace              = true
rust-embed.workspace          = true
serde.workspace               = true
serde_json.workspace          = true
tempfile.workspace            = true
toml.workspace                = true
tracing.workspace             = true
tracing-subscriber.workspace  = true
ureq                          = { optional = true, workspace = true }

[dev-dependencies]
# Real windows, headless: `src/e2e.rs` clicks and types in them. As for
# `capture`, on GPUI itself: gpui-kit's `test-support` can't resolve with the
# locked taffy.
gpui-capture          = { default-features = false, features = ["test-support"], package = "gpui-pre", version = "=0.3.10" }
gpui-platform-capture = { default-features = false, features = ["test-support"], package = "gpui-pre-platform", version = "=0.3.10" }
tempfile.workspace    = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics-types = { optional = true, workspace = true }
# `render_entry`'s text, shaped off the main thread, unlike the platform's.
gpui-apple-capture = { features = ["font-kit"], optional = true, package = "gpui-pre-apple", version = "=0.3.10" }
metal              = { optional = true, workspace = true }
moonframe-frames   = { optional = true, workspace = true }
# `ui.browser`'s keys and clipping: a key monitor and the view a page sits in.
block2.workspace           = true
objc2.workspace            = true
objc2-app-kit              = { features = ["NSBezierPath", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSDockTile", "NSEvent", "NSImageView", "NSMenu", "NSMenuItem", "NSRunningApplication", "NSSound", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "block2"], workspace = true }
objc2-foundation.workspace = true
# Finding the AppKit window a trackpad gesture happened in.
raw-window-handle.workspace = true
# `app:notify`: system notifications, and hearing their clicks.
objc2-user-notifications.workspace = true
objc2-web-kit                      = { optional = true, workspace = true }

# wry has no working GPUI child-view backend on Linux yet; a `ui.browser`
# there shows its address and opens it in the system browser.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
wry = { optional = true, workspace = true }

# The Developer tools read and save relative to a folder opened and checked
# once, so no link swapped in after the check leads them out of the app.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix.workspace = true
