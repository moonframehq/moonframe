[package]
edition.workspace      = true
license.workspace      = true
name                   = "moonframe"
publish.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# The terminal emulators `ui.terminal` can run on; both by default. `ghostty`
# builds libghostty-vt with Zig (see mise.toml and tools/zig).
alacritty = ["moonframe-terminal/alacritty"]
default   = ["alacritty", "ghostty"]
ghostty   = ["moonframe-terminal/ghostty"]

[dependencies]
futures.workspace             = true
gpui-kit.workspace            = true
moonframe-core.workspace      = true
moonframe-providers.workspace = true
moonframe-store.workspace     = true
moonframe-terminal.workspace  = true
notify.workspace              = true
rust-embed.workspace          = true
serde.workspace               = true
toml.workspace                = true
tracing.workspace             = true
tracing-subscriber.workspace  = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# `ui.browser`'s keys and clipping: a key monitor and the view a page sits in.
block2.workspace           = true
objc2.workspace            = true
objc2-app-kit              = { features = ["NSEvent", "NSView", "NSWindow", "block2"], workspace = true }
objc2-foundation.workspace = true
objc2-web-kit.workspace    = true

# wry has no working GPUI child-view backend on Linux yet; a `ui.browser`
# there shows its address and opens it in the system browser.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
wry.workspace = true
