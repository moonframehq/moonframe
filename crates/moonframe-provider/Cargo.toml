[package]
edition      = "2024"
license      = "MIT"
name         = "moonframe-provider"
publish      = false
rust-version = "1.99"
version      = "0.4.0"

[features]
stateful = []

[dependencies]
serde      = "1"
serde_json = "1"

# The WIT bindings exist only in the component; compiled into the app, the
# same provider reaches the host through `native` instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"

# Standalone: providers do not inherit the native host workspace's hooks.
[workspace]
